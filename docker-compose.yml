version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cortedarainha-postgres
    restart: always
    environment:
      POSTGRES_USER: cortedarainha
      POSTGRES_PASSWORD: cortedarainha_secret
      POSTGRES_DB: cortedarainha_db
    ports:
      - "5433:5432"
    volumes:
      - cortedarainha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortedarainha -d cortedarainha_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cortedarainha_pgdata:
    name: cortedarainha_pgdata
