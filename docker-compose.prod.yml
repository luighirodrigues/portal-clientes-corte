version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://cortedarainha:cortedarainha_secret@postgres:5432/cortedarainha_db?schema=public
      - APP_SECRET=cortedarainha_super_secret_key_32c
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: cortedarainha
      POSTGRES_PASSWORD: cortedarainha_secret
      POSTGRES_DB: cortedarainha_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortedarainha -d cortedarainha_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: cortedarainha_prod_pgdata
  uploads_data:
    name: cortedarainha_prod_uploads
